<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GDC – teste de renderização</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px sans-serif; }
  img { display: block; max-width: 100%; }
  p { padding: 8px 12px; margin: 0; }
</style>
</head>
<body>
<p id="info">Gerando...</p>
<img id="out" alt="dungeon">
<script type="module">
  // Uso: render-test.html?seed=abc&grid=4   (precisa do servidor que expõe /foundry/ = resources/app/common)
  Math.SQRT3 = 1.7320508075688772;
  Math.SQRT1_3 = 0.5773502691896257;
  const { default: SquareGrid } = await import("/foundry/grid/square.mjs");
  const { default: HexagonalGrid } = await import("/foundry/grid/hexagonal.mjs");
  const { generateDungeon } = await import("../scripts/generator.js");
  const { buildWallSegments } = await import("../scripts/walls.js");
  const { renderDungeon } = await import("../scripts/renderer.js");
  const { createTopology, createGrid } = await import("../scripts/topology.js");

  const params = new URLSearchParams(location.search);
  const seed = params.get("seed") || "teste";
  const gridType = Number(params.get("grid") || 4);
  const wallStyle = params.get("style") || "straight";
  const topo = createTopology(createGrid(gridType, 100, { SquareGrid, HexagonalGrid }), 50, 36, wallStyle);
  const corridorWidth = Number(params.get("width") || 1);
  const exits = (params.get('exits') || '').split(',').filter(Boolean).map((e, k) => {
    const [side, pos] = e.split(':');
    return { id: 'x' + k, side, pos: Number(pos) };
  });
  const d = generateDungeon(topo, { seed, corridorWidth, exits, layout: params.get('layout') || 'rooms', lockedChance: Number(params.get('locked') ?? 0.2), traps: 3, pillars: params.get('pillars') !== '0', pillarSpan: Number(params.get('span') || 6) });
  const segs = buildWallSegments(d, { openExits: d.exits.map(ex => ex.cell) });
  const { placeLights } = await import("../scripts/lights.js");
  const lights = placeLights(d, { lightChance: 0.8, placement: params.get("lights") || "wall" });
  // ?assets=1 usa a pasta Data/assets/gurps-dungeon-creator (servir a pasta Data como raiz)
  const A = '/assets/gurps-dungeon-creator/';
  const assets = params.get('assets') ? {
    floorRoom: A + 'floor-room.jpg', floorCorridor: A + 'floor-corridor.jpg', door: A + 'door.png',
    doorFrame: A + 'door-frame.png', pillar: A + 'pillar.png', entrance: A + 'entrance.png'
  } : {};
  const blob = await renderDungeon(d, segs, { lights, exits: d.exits, assets });
  // Mesas (no Foundry viram Tiles): desenhadas por cima só para visualizar
  let finalBlob = blob;
  if (params.get('assets')) {
    const { placeFurniture } = await import('../scripts/furniture.js');
    const load = async src => createImageBitmap(await (await fetch(src)).blob());
    const tables = [];
    for (const n of ['table-long.png', 'table-small.png']) { const b = await load(A + n); tables.push({ src: A + n, width: b.width, height: b.height, bitmap: b }); }
    const placed = placeFurniture(d, tables);
    const base = await createImageBitmap(blob);
    const cv = new OffscreenCanvas(base.width, base.height); const cx = cv.getContext('2d');
    cx.drawImage(base, 0, 0);
    for (const f of placed) {
      const t = tables.find(x => x.src === f.src);
      cx.save(); cx.translate(f.x + f.width / 2, f.y + f.height / 2); cx.rotate(f.rotation * Math.PI / 180);
      cx.drawImage(t.bitmap, -f.width / 2, -f.height / 2, f.width, f.height); cx.restore();
    }
    finalBlob = await cv.convertToBlob({ type: 'image/webp', quality: 0.85 });
  }
  document.getElementById("out").src = URL.createObjectURL(finalBlob);
  document.getElementById("info").textContent =
    `grid=${gridType} seed=${seed} · ${d.rooms.length} salas · ${segs.doors.length} portas · ${segs.walls.length} paredes · ${(blob.size / 1024).toFixed(0)} KB`;
</script>
</body>
</html>
